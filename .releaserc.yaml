branches:
  - release

plugins:
  - '@semantic-release/commit-analyzer'

  - '@semantic-release/release-notes-generator'

  - - '@semantic-release/exec'
    - verifyReleaseCmd: 'echo "version=${nextRelease.version}" >> "$GITHUB_OUTPUT"'
      successCmd: 'node --experimental-strip-types --experimental-transform-types scripts/release/dispatch-release-notes.ts "${nextRelease.gitTag}"'

  - '@semantic-release/npm'

  - - '@semantic-release/git'
    - assets: [dist, package.json]
      message: 'ci(release): build action for ${nextRelease.version} [skip ci]'

  - - '@semantic-release/github'
    - releasedLabels: false
      successComment: false

analyzeCommits:
  releaseRules:
    # This project stays 0.x: a breaking change is a minor bump, never major (0.110.x -> 0.111.0,
    # not 1.0.0). Listed first so the scoped suppression rules below still win when a breaking
    # commit also matches one of them (confirmed against @semantic-release/commit-analyzer's
    # actual rule-matching order in scripts/release/release-policy.test.ts).
    - breaking: true
      release: minor
    - type: build
      release: patch
    - type: build
      scope: dev
      release: false
    - type: docs
      release: patch
      scope: readme
    - type: docs
      release: patch
      scope: rfcs
    - type: skip
      release: false

preset: conventionalcommits

presetConfig:
  types:
    - type: feat
      section: Features
    - type: features
      section: Features
    - type: build
      section: Build System
    - type: fix
      section: Bug Fixes
    - type: docs
      section: Documentation
    - type: test
      section: Tests
    - type: ci
      section: Continuous Integration
    - type: style
      section: Styles
    - type: refactor
      section: Code Refactoring
    - type: perf
      section: Performance Improvements
    - type: revert
      section: Reverts
    - type: chore
      section: Miscellaneous Chores
    - type: skip
      effect: hidden
