---
name: Setup Node.js and Bun
description: Sets up Bun (the version in the root package.json packageManager field) and Node.js with dependency caching

inputs:
  node-version:
    description: Node.js version to use. If not provided, reads from .node-version file.
    required: false
  install-dependencies:
    description: Whether to run bun install after setup
    required: false
    default: 'true'

outputs:
  node-version:
    description: The resolved Node.js version
    value: ${{ steps.setup-node.outputs.node-version }}

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json

    # setup-bun falls back to the latest Bun, with only a warning, when the file or the field is missing.
    - name: Verify Bun matches packageManager
      shell: bash
      run: |
        expected="$(bun -p "(require(process.cwd() + '/package.json').packageManager ?? '').replace(/^bun@/, '')")"
        actual="$(bun --version)"
        case "${expected}" in ''|*[!0-9.]*) echo "::error::package.json packageManager must be bun@<exact version>, found '${expected}'"; exit 1 ;; esac
        [ "${actual}" = "${expected}" ] || { echo "::error::Bun ${actual} is installed but package.json packageManager is bun@${expected}"; exit 1; }
        echo "Bun ${actual} matches packageManager"

    - name: Setup Node.js
      id: setup-node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}

    - name: Cache Bun dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # Bun's global install cache (shared across workspace packages), keyed by bun.lock.
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: bun install --frozen-lockfile
