name: opencode-plugin-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example 0.1.0 or 0.2.0-rc.1)
        required: true
        type: string
      dry_run:
        description: 'Dry run: verify and pack, but do not publish'
        required: false
        type: boolean
        default: false

concurrency:
  group: opencode-plugin-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify (gates, build, pack)
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    outputs:
      version: ${{ steps.params.outputs.version }}
      dry_run: ${{ steps.params.outputs.dry_run }}
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve version
        id: params
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${VERSION}' is not a plain semver version"
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "dry_run=${DRY_RUN:-false}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js and Bun
        uses: ./.github/actions/setup

      - name: Lint, type-check and test
        run: |
          set -euo pipefail
          bun run --filter @fro.bot/opencode-plugin lint
          bun run --filter @fro.bot/opencode-plugin check-types
          bun run --filter @fro.bot/opencode-plugin test

      - name: Build
        run: bun run --filter @fro.bot/opencode-plugin build

      - name: Check the bundle only imports what the host provides
        working-directory: packages/opencode-plugin
        run: |
          set -euo pipefail
          # Checks every emitted file, not only the entry: the OpenTelemetry SDK is inlined into a lazily loaded chunk.
          # A relative import is allowed only when it is a regular file inside dist.
          node --input-type=module <<'EOF'
          import {existsSync, lstatSync, readdirSync, readFileSync, realpathSync} from "node:fs"
          import path from "node:path"

          const dist = realpathSync("dist")
          const entry = "index.mjs"
          const files = readdirSync(dist).filter(name => name.endsWith(".mjs"))
          const forbidden = ["child_process", "vm", "worker_threads"]
          const hostProvided = s => s === "effect" || s.startsWith("effect/") || s === "@opencode/plugin" || s.startsWith("@opencode/plugin/") || s.startsWith("node:")
          const take = (source, pattern) => [...source.matchAll(pattern)].map(m => m[1])
          const primitives = [
            ["a dynamic import with a non-literal argument", /\bimport\s*\((?!\s*["'][^"'\n]*["']\s*\))/],
            ["createRequire", /\bcreateRequire\b/],
            ["import.meta.resolve", /\bimport\s*\.\s*meta\s*\.\s*resolve\b/],
            ["process.binding or process.dlopen", /\bprocess\s*(?:\.|\[\s*["'`])\s*(?:binding|dlopen)\b/],
            ["eval", /\beval\b/],
            ["the Function constructor", /\bnew\s+Function\b|(?<![\w$.])Function\s*\(|\bconstructor\s*\.\s*constructor\b/],
          ]
          const errors = []
          const seen = new Set()

          // Only ES module chunks, their source maps and declarations belong in dist.
          for (const name of readdirSync(dist)) {
            if (!/\.(?:mjs|mjs\.map|d\.mts|d\.mts\.map)$/.test(name)) errors.push(`dist/${name}: not an expected build output`)
          }

          for (const file of files) {
            const source = readFileSync(path.join(dist, file), "utf8")
            // Static imports and re-exports start a line in the bundler output; an unanchored `from "x"` also matches prose in strings.
            const statics = [...take(source, /^(?:import|export)\s[^"'`;]*\sfrom\s*["']([^"']+)["']/gm), ...take(source, /^import\s*["']([^"']+)["']/gm)]
            const dynamics = take(source, /\bimport\(\s*["']([^"']+)["']\s*\)/g)
            const requires = take(source, /(?<![\w$.])(?:__)?require\(\s*["']([^"']+)["']\s*\)/g)
            for (const s of requires) errors.push(`${file}: require("${s}") in an ES module bundle`)
            for (const name of forbidden) {
              if (new RegExp(`["'](?:node:)?${name}["']`).test(source)) errors.push(`${file}: names node:${name}`)
            }
            // Loading and evaluation primitives the import scan cannot see. A textual deny, not a parser: it fails closed, so a
            // comment or string that spells one is flagged too and has to be reworded. packages/opencode-plugin/src/bundle.test.ts
            // holds the same list and runs this script over bypass fixtures.
            for (const [label, pattern] of primitives) if (pattern.test(source)) errors.push(`${file}: uses ${label}`)
            for (const s of [...statics, ...dynamics]) {
              seen.add(s)
              if (hostProvided(s)) continue
              if (!s.startsWith("./")) { errors.push(`${file}: unexpected import "${s}"`); continue }
              // A relative import is allowed only when it is a regular file (not a link) inside dist that this check also scans.
              const target = path.resolve(dist, s)
              const inside = target.startsWith(dist + path.sep)
              if (!inside || !existsSync(target) || !lstatSync(target).isFile() || !files.includes(path.basename(target)) || path.dirname(target) !== dist) {
                errors.push(`${file}: relative import "${s}" is not a regular .mjs file inside dist`)
              }
            }
            // The entry loads tracing code only through a dynamic import, so a tracing-off start never evaluates it.
            if (file === entry) {
              for (const s of statics) if (!hostProvided(s)) errors.push(`${file}: static import of "${s}" (only host-provided modules may be imported statically)`)
              if (!statics.includes("@opencode/plugin")) errors.push(`${file}: no longer imports @opencode/plugin`)
            }
          }
          if (!files.includes(entry)) errors.push(`dist/${entry} is missing`)

          if (errors.length > 0) {
            for (const message of errors) console.error("::error::" + message)
            process.exit(1)
          }
          console.log(`bundle imports ok: ${files.length} files; ` + [...seen].sort().join(", "))
          EOF

      - name: Check the built bundle shape (tests)
        working-directory: packages/opencode-plugin
        env:
          FRO_BOT_REQUIRE_PLUGIN_BUNDLE: '1'
        run: bunx vitest run --config ../../vitest.config.ts src/bundle.test.ts

      - name: Pack
        id: pack
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: |
          set -euo pipefail
          # Packed from a staging copy so the workspace manifest (workspace:* devDependencies) is never published.
          STAGE="$(mktemp -d)"
          PKG=packages/opencode-plugin
          mkdir -p "${STAGE}/pkg" "${STAGE}/out"
          cp -R "${PKG}/dist" "${PKG}/README.md" "${PKG}/LICENSE" "${PKG}/THIRD_PARTY_NOTICES.md" "${PKG}/package.json" "${STAGE}/pkg/"
          (
            cd "${STAGE}/pkg"
            npm pkg set "version=${VERSION}"
            npm pkg delete devDependencies scripts
            npm pack --pack-destination "${STAGE}/out"
          )
          TARBALL="$(ls "${STAGE}/out")"
          mkdir -p dist-tarball
          cp "${STAGE}/out/${TARBALL}" "dist-tarball/${TARBALL}"
          CONTENTS="$(tar -tzf "dist-tarball/${TARBALL}")"
          echo "Packed contents:"
          echo "${CONTENTS}"
          # The notices travel with the inlined third-party code. Matched on the saved listing: `tar | grep -q` can fail under pipefail.
          grep -qx 'package/THIRD_PARTY_NOTICES.md' <<<"${CONTENTS}" \
            || { echo "::error::the tarball is missing THIRD_PARTY_NOTICES.md"; exit 1; }
          echo "tarball=${TARBALL}" >> "${GITHUB_OUTPUT}"

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencode-plugin-tarball
          path: dist-tarball/
          if-no-files-found: error
          retention-days: 7

  # id-token is granted here only. This job runs none of the repository's code, so nothing in the build can obtain an
  # OIDC token; it publishes the tarball verify produced.
  publish:
    name: publish (npm trusted publishing)
    needs: verify
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.verify.outputs.dry_run != 'true' }}
    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opencode-plugin-tarball
          path: dist-tarball

      - name: Setup Node.js (for npm trusted publishing via OIDC)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm supports trusted publishing
        run: |
          version="$(npm --version)"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$version" \
            || { echo "::error::npm ${version} is older than 11.5.1, which trusted publishing requires"; exit 1; }

      - name: Publish to npm (trusted publishing)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: |
          set -euo pipefail
          if npm view "@fro.bot/opencode-plugin@${VERSION}" version >/dev/null 2>&1; then
            echo "Already published: @fro.bot/opencode-plugin@${VERSION}; skipping"
            exit 0
          fi

          case "${VERSION}" in
            *-*) DIST_TAG="next" ;;
            *) DIST_TAG="latest" ;;
          esac

          echo "Publishing @fro.bot/opencode-plugin@${VERSION} (dist-tag ${DIST_TAG})..."
          npm publish "./dist-tarball/${TARBALL}" --tag "${DIST_TAG}"
