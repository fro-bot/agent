---
# ONE-JOB SECURITY INVARIANT
# ---------------------------------------------------------------------------
# This workflow MUST have exactly one job.
#
# The broker's allowlist pins `job_workflow_ref` to
# `fro-bot/agent/.github/workflows/harness-integrate.yaml@refs/heads/main`.
# That pin authorizes ANY job in THIS file to mint a credential — it does not
# distinguish between jobs. A second job would silently inherit the same
# minting authority without a corresponding allowlist review.
#
# Any change that adds a job to this file is security-critical and must be
# reviewed as such. Keep `id-token: write` scoped to the single `integrate`
# job below; do not add other jobs.
# ---------------------------------------------------------------------------
name: harness-integrate

# Deny every scope by default. The single `integrate` job below declares the two
# scopes it needs, and a job-level block replaces this one rather than merging
# with it, so the existing mint and checkout are unaffected. A future job added
# without its own block gets nothing and fails loudly at checkout, which is the
# intended outcome for a file where adding a job is security-critical.
permissions: {}

on:
  workflow_call:
    inputs:
      model:
        description: Model override for the merge agent (e.g. anthropic/claude-sonnet-5). Falls back to vars.HARNESS_MODEL when omitted.
        type: string
        required: false
      prompt:
        description: The rendered integration prompt to run.
        type: string
        required: false
      base-version:
        description: Resolved base release version used by authoritative and shadow integration paths.
        type: string
        required: true
    secrets:
      APPLICATION_ID:
        description: GitHub App id used to mint the scoped installation token for trusted finalization. Required.
        required: true
      APPLICATION_PRIVATE_KEY:
        description: GitHub App private key (PEM). Mapped only to the mint step's env; never job-level. Required.
        required: true
      OPENCODE_CONFIG:
        description: JSON merged into the OpenCode config (OPENCODE_CONFIG_CONTENT). Optional.
        required: false
      OMO_PROVIDERS:
        description: Comma-separated oMo providers passed through to the merge (enable-omo is true on this path). Optional.
        required: false
      # NO OPENCODE_AUTH_JSON. NO secrets: inherit. The durable model credential must
      # never reach this workflow — see docs/plans/2026-07-01-001-feat-harness-merge-credential-broker-plan.md.

jobs:
  # ---------------------------------------------------------------------------
  # Single job: id-token: write is required to request the OIDC token minted
  # against the credential broker. contents: read is required for checkout.
  # Everything else is omitted (denied by default). See the ONE-JOB SECURITY
  # INVARIANT comment at the top of this file before adding anything here.
  # ---------------------------------------------------------------------------
  integrate:
    name: integrate
    runs-on: ubuntu-latest
    # INTEGRATION_JOB_TIMEOUT_MINUTES = 120. Leaves room for evidence recording
    # while preventing the reusable job from inheriting GitHub's 360-minute default.
    timeout-minutes: 120

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Harden runner egress
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          disable-telemetry: true
          disable-sudo-and-containers: true
          allowed-endpoints: >-
            api.github.com:443
            broker.fro.bot:443
            bun.sh:443
            codeload.github.com:443
            cliproxy.fro.bot:443
            github.com:443
            models.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            *.actions.githubusercontent.com:443
            *.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Default GITHUB_TOKEN: checkout needs only contents: read. The
          # scoped App token is minted as late as possible (below) so its
          # ~1h TTL is not spent on checkout/setup.
          token: ${{ github.token }}

      - name: Setup Node.js and Bun
        uses: ./.github/actions/setup

      - name: Mint broker credential
        id: mint
        run: node --experimental-strip-types scripts/harness/mint-broker-credential.ts

      # SYNC: keep the shared merge inputs in step with fro-bot.yaml's Run Fro Bot step
      - name: Run Fro Bot
        uses: ./
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          # Keep provider-level failures diagnosable; trusted finalization owns the pushed ref.
          OPENCODE_PROMPT_ARTIFACT: 'true'
        with:
          auth-json: ${{ steps.mint.outputs.auth-json }}
          github-token: ${{ github.token }}
          model: ${{ inputs.model || vars.HARNESS_MODEL }}
          prompt: ${{ inputs.prompt }}
          response-mode: none
          # Integration delivery is always local; keep this caller explicit so
          # prompt wording cannot change the output contract.
          output-mode: working-dir
          opencode-config: ${{ secrets.OPENCODE_CONFIG }}
          timeout: '0'

      # Trusted inline no-post mint. MUST stay a plain run: step invoking the
      # checked-in script — never a marketplace action with a post: hook (the
      # runner re-supplies INPUT_* — including the private key — during the
      # post phase, and a prompt-injected earlier step can tamper the on-disk
      # post script; see docs/plans/2026-07-11-002-feat-inline-app-token-mint-integrate-plan.md).
      # The App secrets are mapped to THIS step's env only — never job-level.
      - name: Mint scoped App token for trusted finalization
        id: mint-app-token
        run: node --experimental-strip-types scripts/harness/mint-app-token.ts
        env:
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
          APPLICATION_PRIVATE_KEY: ${{ secrets.APPLICATION_PRIVATE_KEY }}

      - name: Freeze, build, validate, and push candidate
        id: trusted-integrate
        env:
          BASE_VERSION: ${{ inputs.base-version }}
          WORK_DIR: ${{ runner.temp }}/harness-integrate-work
          ARTIFACT: ${{ runner.temp }}/harness-authoritative-artifact.tar
          GH_TOKEN: ${{ steps.mint-app-token.outputs.github-token }}
          GITHUB_TOKEN: ''
        run: >-
          bun run packages/harness/src/cli.ts integrate
          --candidate
          --base-version "$BASE_VERSION"
          --work-dir "$WORK_DIR"
          --out "$ARTIFACT"
          --push-repo "https://github.com/fro-bot/agent.git"
          --push-ref "refs/harness-integrate/$BASE_VERSION"

      - name: Run forward shadow integration
        id: shadow-integrate
        if: ${{ always() }}
        continue-on-error: true
        # FORWARD_SHADOW_STEP_TIMEOUT_MINUTES = 90. Healthy shadow runs need
        # clone/fetch/merge/model/build headroom, but must stop before the job backstop.
        timeout-minutes: 90
        env:
          BASE_VERSION: ${{ inputs.base-version }}
          SHADOW_WORK_DIR: ${{ runner.temp }}/harness-shadow-work
          SHADOW_ARTIFACT: ${{ runner.temp }}/harness-shadow-artifact.tar
          SHADOW_RESULT: ${{ runner.temp }}/harness-shadow-result.json
          HARNESS_BROKER_AUTH_JSON: ${{ steps.mint.outputs.auth-json }}
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: >-
          bun run packages/harness/src/cli.ts integrate
          --dry-run
          --base-version "$BASE_VERSION"
          --work-dir "$SHADOW_WORK_DIR"
          --out "$SHADOW_ARTIFACT"
          --result-out "$SHADOW_RESULT"

      - name: Record forward shadow evidence
        id: shadow-record
        if: ${{ always() }}
        continue-on-error: true
        env:
          BASE_VERSION: ${{ inputs.base-version }}
          SHADOW_WORK_DIR: ${{ runner.temp }}/harness-shadow-work
          SHADOW_RESULT: ${{ runner.temp }}/harness-shadow-result.json
          SHADOW_RECORD: ${{ runner.temp }}/harness-shadow-${{ inputs.base-version }}.json
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          RELEASE_REPO: anomalyco/opencode
          AUTHORITATIVE_REPOSITORY: fro-bot/agent
          RUN_IDENTITY: ${{ github.run_id }}/${{ github.run_attempt }}/${{ github.workflow_ref }}/${{ github.server_url }}/${{ github.repository }}
        run: >-
          bun run packages/harness/src/forward-shadow-command.ts
          --result-out "$SHADOW_RESULT"
          --record-out "$SHADOW_RECORD"
          --base-version "$BASE_VERSION"
          --shadow-work-dir "$SHADOW_WORK_DIR"
          --release-repo "$RELEASE_REPO"
          --authoritative-repository "$AUTHORITATIVE_REPOSITORY"
          --authoritative-ref "refs/harness-integrate/$BASE_VERSION"
          --run-identity "$RUN_IDENTITY"

      - name: Upload forward shadow evidence
        id: upload-shadow-record
        if: ${{ always() }}
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-shadow-${{ inputs.base-version }}
          path: ${{ runner.temp }}/harness-shadow-${{ inputs.base-version }}.json
          if-no-files-found: warn
          retention-days: 90
