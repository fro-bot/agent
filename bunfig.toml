# Bun configuration for the workspace.
# Workspace packages, overrides, and trustedDependencies live in package.json.

[install]
# Hoisted (flat) node_modules layout. The isolated linker places packages under
# non-portable `node_modules/.bun/<pkg>@<hash>/` paths, which makes TypeScript
# unable to name deep dependency types (TS2883 on eslint.config.ts referencing
# @eslint/core) and produces duplicate dependency instances. Hoisting keeps the
# toolchain's type resolution portable.
linker = "hoisted"

# Supply-chain age gate: refuse dependency versions published within this window.
# Mirrors the prior pnpm minimumReleaseAge policy. Seconds (3 days).
minimumReleaseAge = 259200

# First-party packages, published from bfra-me/works under the same ownership as
# this repo. The age gate buys a cooling-off period against a compromised upstream
# publish; it has nothing to buy here, and it blocks Renovate's own update PRs from
# installing for three days. Bun matches these exactly — no glob support.
# `@opencode/*` is the OpenCode V2 plugin API (first-party upstream, published in lockstep). `@opencode/plugin` pulls in
# the other five as hard dependencies, so the exemption names every package of the pinned build rather than a glob. The
# array stays JSON-compatible (scripts/bfra-me-exemption-guard.test.ts parses it), so these notes live up here.
minimumReleaseAgeExcludes = [
  "@bfra.me/es",
  "@bfra.me/eslint-config",
  "@bfra.me/prettier-config",
  "@bfra.me/tsconfig",
  "@opencode/ai",
  "@opencode/client",
  "@opencode/plugin",
  "@opencode/protocol",
  "@opencode/schema",
  "@opencode/util"
]
